[package]
name = "aberp-qc-pdf"
description = "QC inspection-report / Certificate-of-Conformance / AS9102 Rev C FAIR PDF renderer. ADR-0199."
# NOT `version.workspace = true`. The workspace version is `0.0.0` and
# always has been, so every issued report recorded
# `renderer_version = "0.0.0"` — which made the field useless for the one
# question it exists to answer: when a re-render's SHA does not match the
# pin, was the RENDERER changed or were the rows TAMPERED with? This is a
# layout version, owned by this crate. **Bump it in the same commit as any
# change to the rendered bytes.**
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "aberp_qc_pdf"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
lopdf = { workspace = true }
# The frozen report rows this crate renders. `aberp-qa` is the schema
# author; this crate holds NO model of its own, so a schema change cannot
# leave the renderer describing rows that no longer exist.
aberp-qa = { path = "../aberp-qa" }

[lints]
workspace = true
