# ADR-0093 saw-off cut-gate — DB-isolation guardrail (the REQUIRED check).
#
# Deliberately a standalone, toolchain-free job: it runs the bash cut-gate
# (tools/cut_gate_db_isolation.sh, CHECK 1–10) PLUS the negative-probe harness
# with nothing but a checkout, so it gates in seconds and stays green
# independently of the heavy Rust+Tauri build in ci.yml. Its sole job is to
# make the ADR-0002/ADR-0093 DB-isolation mandate un-droppable at a
# product-line cut.
#
# This is the workflow intended as the branch-protection REQUIRED status
# check on the editions repo (see SAW-OFF.md → "Required status check (chunk
# 5 wiring)"). Because it needs no toolchain it can be required without making
# the gate hostage to an 8-minute build.
name: cut-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  db-isolation:
    name: ADR-0093 DB-isolation cut-gate
    runs-on: ubuntu-latest
    # ADR-0098 R6: raised 5 -> 15. ADR-0105: raised 15 -> 30.
    #
    # The gate itself runs in ~15 s. The cost is the negative-probe harness
    # (tools/cut_gate_negative_probes.sh), which fresh()-copies the whole tree
    # once per probe and re-runs the full gate each time.
    #
    # MEASURED on this runner (job 92868392762, 2026-08-07), not estimated:
    # **17.5 s per probe**, 46 probes -> ~13.4 min, job total **14 m 32 s**
    # against the old 15-min cap — a ~28-second margin. The "~5 min" figure in
    # the previous version of this comment was stale by a wide margin: the suite
    # was already at ~12.3 min (41 probes) BEFORE the 5 ADR-0105 CHECK-10N
    # probes were added, so it had been running one slow runner away from the cap
    # for some time. That is precisely the failure this comment already records:
    # the job gets CANCELLED, which is a false red on a REQUIRED check (and a red
    # on main, since this workflow also runs on push:main).
    #
    # Pure timeout accommodation — every ENFORCE_* check still runs in full and
    # must pass. No de-gate, no probe skipped.
    #
    # FLAG (v0.2.6), now load-bearing rather than nice-to-have: the harness is
    # O(probes x full-tree-copy + full-gate-run). Speeding up fresh() (git
    # archive / a shared worktree, or a single copy reused read-only with the
    # plant applied via overlay) would take this back to a couple of minutes and
    # remove the standing cap risk. Until then, every new probe costs ~17.5 s and
    # the cap must be re-checked when probes are added.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Run DB-isolation cut-gate (CHECK 1–10, all ENFORCED)
        # Every ENFORCE_* flag is explicit here as well as defaulted in the
        # script, so enforcement is visible at the CI surface and cannot be
        # silently weakened by a one-line script edit.
        env:
          ENFORCE_EDITION_DB_BINDING: "1"        # CHECK 3 (chunk 2)
          ENFORCE_CHUNK3_INVARIANTS: "1"         # CHECK 4 (chunk 3)
          ENFORCE_CHECKPOINT_ATOMIC: "1"         # CHECK 5 (chunk 4)
          ENFORCE_SNAPSHOT_STORE_ISOLATION: "1"  # CHECK 6 (chunk 4)
          ENFORCE_LAUNCHER_ARM_MATCH: "1"        # CHECK 7 (chunk 4)
        run: bash tools/cut_gate_db_isolation.sh

      - name: Prove the cut-gate has teeth (negative probes)
        # Plants each invariant's violation in a throwaway copy and asserts the
        # gate FAILS — so a green gate above is a meaningful signal, not a
        # gate that can no longer go red.
        run: bash tools/cut_gate_negative_probes.sh
