# ADR-0093 saw-off cut-gate — DB-isolation guardrail (the REQUIRED check).
#
# Deliberately a standalone, toolchain-free job: it runs the bash cut-gate
# (tools/cut_gate_db_isolation.sh, CHECK 1–10) PLUS the negative-probe harness
# with nothing but a checkout, so it gates in seconds and stays green
# independently of the heavy Rust+Tauri build in ci.yml. Its sole job is to
# make the ADR-0002/ADR-0093 DB-isolation mandate un-droppable at a
# product-line cut.
#
# This is the workflow intended as the branch-protection REQUIRED status
# check on the editions repo (see SAW-OFF.md → "Required status check (chunk
# 5 wiring)"). Because it needs no toolchain it can be required without making
# the gate hostage to an 8-minute build.
name: cut-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ── the gates themselves (cheap: no probe re-runs) ──────────────────────────
  # Runs every ENFORCE_* gate once, plus the two SMALL probe harnesses whose own
  # gates are cheap (durable-ack ~4 s, checkpoint-sites ~7 s per run). The
  # expensive one — cut_gate_negative_probes.sh, which re-runs the WHOLE
  # DB-isolation gate once per probe — is sharded into `negative-probes` below.
  gates:
    name: gates (all ENFORCED) + small probe harnesses
    runs-on: ubuntu-latest
    # HISTORY of this cap, because it is the thing that kept breaking:
    # ADR-0098 R6 raised it 5 -> 15, ADR-0105 15 -> 30, ADR-0099 R6 30 -> 75.
    # Every one of those was pure timeout accommodation for the same underlying
    # shape — the negative-probe harness re-running the WHOLE gate once per
    # probe — and each one bought a little time instead of fixing it. The v0.6.1
    # cut attempt died on the 30-minute cap with every probe PASSING and the
    # gate exiting 0: the job was simply CANCELLED, which is a false red on a
    # REQUIRED check (and a red on main, since this workflow runs on push:main).
    #
    # That escalation ends here. The harness is now SHARDED (see the
    # `negative-probes` job below), so this job carries only work that is O(1)
    # in the probe count and its cap is back to a sane 20 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Run DB-isolation cut-gate (CHECK 1–10, all ENFORCED)
        # Every ENFORCE_* flag is explicit here as well as defaulted in the
        # script, so enforcement is visible at the CI surface and cannot be
        # silently weakened by a one-line script edit.
        env:
          ENFORCE_EDITION_DB_BINDING: "1"        # CHECK 3 (chunk 2)
          ENFORCE_CHUNK3_INVARIANTS: "1"         # CHECK 4 (chunk 3)
          ENFORCE_CHECKPOINT_ATOMIC: "1"         # CHECK 5 (chunk 4)
          ENFORCE_SNAPSHOT_STORE_ISOLATION: "1"  # CHECK 6 (chunk 4)
          ENFORCE_LAUNCHER_ARM_MATCH: "1"        # CHECK 7 (chunk 4)
        run: bash tools/cut_gate_db_isolation.sh

      - name: ADR-0110 D3 durable-ack gate (money-path census, ENFORCED)
        # D3 ports Portable PROD_v2.33.6's power-loss durability to Defense's
        # money paths. One test is not a gate: the fault-injection suite
        # (crates/aberp-db/tests/durable_ack_fault_injection.rs) proves the ack
        # really reaches the filesystem TODAY and runs in ci.yml; THIS keeps it
        # that way, by holding the census of money-path `Handle::durable_ack()`
        # sites closed in BOTH directions — a deleted call and an unregistered
        # new one are equally red — and by requiring each call to PROPAGATE its
        # error (CHECK D3-C), since a present-but-swallowed ack is the exact
        # rule-11 downgrade that would look green while promising nothing.
        # It is the only cover for the three ack sites no unattended test
        # reaches (modification, storno, AP status change — all need NAV or an
        # operator). Enforcement is explicit here as well as defaulted in the
        # script, so it cannot be silently weakened by a one-line script edit.
        env:
          ENFORCE_DURABLE_ACK: "1"
        run: bash tools/cut_gate_durable_ack.sh

      - name: Prove the durable-ack gate has teeth (negative probes)
        # Plants each real regression shape — the call deleted, commented out
        # "just for now", an unregistered new call site, a census entry dropped,
        # and the call kept but its error swallowed — and asserts RED. Pins the
        # non-triggers too: the unmutated tree stays GREEN and a doc-comment
        # mention is never counted as a call, because a gate that cries wolf
        # gets switched off. Also asserts a de-gated run ANNOUNCES itself.
        run: bash tools/cut_gate_durable_ack_probes.sh

      - name: ADR-0111 checkpoint-site gate (call-site census, ENFORCED)
        # The durable checkpoint commits by renaming a new inode over the live
        # DB and unlinking its WAL. Run on a PATH while the shared Handle is
        # open, that strands the shared connection on the old inode: later
        # commits go to a file the kernel frees at exit, while the lockstep
        # sync_mirror — reading that same connection — durably mirrors them.
        # Mirror ahead of DB, which boot refuses and the auto-heal replays: the
        # root behind the recurring audit-chain forks. Two production callers
        # did exactly that for months.
        #
        # crates/aberp-db/tests/checkpoint_swap_orphan.rs proves it is fixed
        # TODAY (and runs in ci.yml); THIS keeps it fixed, by banning the
        # path-based primitive outside its two owner files, holding the
        # Handle::checkpoint_now() census closed in both directions, and
        # pinning the three lines the mechanism actually rests on — the lock,
        # the quiesce and the reopen. Enforcement is explicit here as well as
        # defaulted in the script, so it cannot be silently weakened by a
        # one-line script edit.
        env:
          ENFORCE_CHECKPOINT_SITES: "1"
        run: bash tools/cut_gate_checkpoint_sites.sh

      - name: Prove the checkpoint-site gate has teeth (negative probes)
        # Plants each way this defect comes back — the path-based call
        # restored, the quiesce quietly dropped while every call site still
        # looks correct, the fence downgraded to a log line, census drift in
        # both directions — and asserts RED. Pins the non-triggers too: this
        # gate bans a name that appears in doc comments across the tree and is
        # a strict prefix of the SANCTIONED wrapper's name, so a matcher that
        # cannot tell those apart would cry wolf and get switched off.
        run: bash tools/cut_gate_checkpoint_probes.sh

  # ── the negative-probe harness, SHARDED ─────────────────────────────────────
  # tools/cut_gate_negative_probes.sh plants each invariant's violation in a
  # throwaway copy of the tree and asserts the gate FAILS — so a green gate is a
  # meaningful signal rather than a gate that can no longer go red. It is also
  # O(probes x full-gate-run), and that product is what kept eating this
  # workflow's cap: on the v0.6.4 landing run it took 70 m 10 s against the
  # 75-minute cap (94%, 4 m 50 s to spare), while the IDENTICAL harness on
  # IDENTICAL input took 54 m 38 s two runs earlier. Ordinary runner variance
  # was one bad draw away from CANCELLING a REQUIRED check, and the next
  # probe-adding ADR would have blown the cap outright.
  #
  # The shards are a PARTITION, not a reduction. Each job runs a disjoint
  # round-robin subset of the SAME probes: same plant, same full fresh() tree
  # copy, same signature asserted against the same COMPLETE gate. No probe is
  # dropped, batched, cached or approximated, and the script itself proves that
  # — it holds EXPECTED_PROBES frozen and fails if its shard's probe count is
  # not exactly its share, so a probe skipped by every shard (zero coverage) or
  # an accounting site that was never made shard-aware is RED, not quietly fast.
  #
  # The suite is green only when EVERY shard is green; `db-isolation` below is
  # the fan-in that enforces that and is the REQUIRED status check.
  #
  # Shard count is a free knob: raising it lowers wall-time until the per-shard
  # fixed cost (one tree copy per probe, ~1-2 s each, paid in every shard)
  # dominates. 6 is the measured sweet spot.
  negative-probes:
    name: negative probes ${{ matrix.shard }}/6 (cut-gate has teeth)
    runs-on: ubuntu-latest
    # ~1/6 of the old 70 min. 30 is deliberate headroom (>2x), not a target —
    # the point of this change is that the cap stops being the binding
    # constraint. If this ever approaches 30 again, raise the shard count, do
    # NOT raise the cap.
    timeout-minutes: 30
    strategy:
      # Every shard must report. Without this, one shard's failure cancels its
      # siblings and their probes report nothing at all — which would look like
      # a single narrow failure when it may be a broad one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - name: Prove the cut-gate has teeth (shard ${{ matrix.shard }} of 6)
        env:
          PROBE_SHARD_INDEX: ${{ matrix.shard }}
          PROBE_SHARD_TOTAL: "6"
        run: bash tools/cut_gate_negative_probes.sh

  # ── REQUIRED STATUS CHECK ───────────────────────────────────────────────────
  # The `name:` below is the branch-protection context on main and MUST NOT
  # change: renaming it silently un-gates the branch, because protection would
  # then wait on a context no job produces (and GitHub does not warn).
  #
  # This job is a pure fan-in. It runs `if: always()` so it ALWAYS reports —
  # a job that is skipped because a dependency failed produces no conclusion,
  # which would leave the required check pending forever instead of red — and
  # it inspects each dependency's result explicitly. Only the literal string
  # 'success' passes: 'failure', 'cancelled' (the cap, or a concurrency
  # cancellation) and 'skipped' are all treated as NOT proven, which is the
  # safe direction and is exactly the "cancelled is a false green" trap this
  # workflow has been bitten by before.
  db-isolation:
    name: ADR-0093 DB-isolation cut-gate
    runs-on: ubuntu-latest
    needs: [gates, negative-probes]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Require every gate job and every probe shard to be green
        env:
          GATES: ${{ needs.gates.result }}
          PROBES: ${{ needs.negative-probes.result }}
        run: |
          echo "gates            = $GATES"
          echo "negative-probes  = $PROBES   (all 6 shards; 'success' only if every one succeeded)"
          rc=0
          [ "$GATES" = "success" ]  || { echo "✗ the ENFORCED gate job did not succeed ($GATES)"; rc=1; }
          [ "$PROBES" = "success" ] || { echo "✗ at least one negative-probe shard did not succeed ($PROBES)"; rc=1; }
          if [ "$rc" -ne 0 ]; then
            echo "ADR-0093 DB-isolation cut-gate: ✗ FAILED"
            exit 1
          fi
          echo "ADR-0093 DB-isolation cut-gate: ✓ every ENFORCED check passed and every probe shard has teeth"
