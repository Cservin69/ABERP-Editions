# ABERP — Editions tree CI (Defense), ADR-0093 saw-off.
#
# This is the FULL-TOOLCHAIN gate that chunks 1–3 honestly DEFERRED to a
# machine with Rust+Tauri (the sandbox could not compile bundled DuckDB's
# ~8-min C++ amalgamation unit or link webkit2gtk). It exercises the whole
# workspace — build, test, clippy, fmt, supply-chain — for the edition arm:
#
#   • Defense   = --features production    (real-NAV production build)
#
# The ADR-0093/0002 DB-isolation cut-gate and the ADR-0111 checkpoint-site
# gate (with both negative-probe harnesses) used to run here too, as a
# fail-fast prelude. They were removed on 2026-08-30 because cut-gate.yml —
# the OTHER required status check — already runs the identical scripts on the
# identical triggers, so this workflow was paying a ~70-min harness a second
# time and being CANCELLED at its own cap. See the block above those removed
# steps for the measurements. This workflow keeps the strict-SVG lint (not
# duplicated anywhere) and remains the sole home of the toolchain work.
#
# The Portable arm was dropped 2026-08-04: this repository is Defense-only,
# and the Portable line is built in ABERP.git per the architecture. That makes
# this a relocation of coverage, not a loss of it. The `PROD_Portable_v*`
# release branches and run/upgrade_portable.sh are deliberately LEFT IN PLACE
# — this change is scoped to CI.
#
# Per ADR-0007 "Supply chain": cargo-deny on --locked deps. (cargo-audit was
# retired 2026-08-04 as feature-blind — see the supply-chain step below,
# deny.toml, and the amended ADR-0007 §"Supply chain".)
# Per ADR-0001/0021: the toolchain is the pinned stable CHANNEL declared in
# rust-toolchain.toml — the MSRV floor lives in each Cargo.toml's
# `rust-version`, and Cargo.lock is the load-bearing reproducibility pin. CI
# installs dtolnay/rust-toolchain@stable to MATCH that channel pin rather than
# hard-coding a version here (which would fight the repo's deliberate ADR-0001
# decision to pin the channel, not a version).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel prior in-flight CI runs for the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3

jobs:
  workspace:
    name: ${{ matrix.edition }} · build + lint + test
    runs-on: ubuntu-latest
    # ADR-0105 raised this 60 -> 90 to survive the negative-probe harness this
    # job used to duplicate from cut-gate.yml. That harness is gone from here
    # (2026-08-30, see the removal note further down), which removed ~70 min
    # from the job: the remaining toolchain tail measured **19 m 54 s** on
    # main @5020773 (steps "Install Tauri system dependencies" through
    # "cargo-deny check", including a 12 m 56 s Test and a cold-ish cache).
    #
    # 90 is DELIBERATELY LEFT AS-IS rather than tightened to fit ~20 min. The
    # historical cancellations this cap was raised for were cold/evicted cargo
    # caches, not runaway work, and an evicted cache can still put ~40 min on
    # the Build+Test steps. A cap that fits the warm case turns a cache miss
    # into a CANCELLED required check — a false red indistinguishable from a
    # real regression, which is the exact failure this comment has recorded
    # twice already. Headroom here is cheap; a false red is not.
    timeout-minutes: 90
    strategy:
      # Defense-only from 2026-08-04: this repository's CI builds the Defense
      # line alone. The Portable line lives in ABERP.git per the architecture,
      # so dropping the arm here is a relocation, not a coverage loss. The
      # matrix shape is kept (single arm) so re-adding a line is a one-entry
      # change and `matrix.edition` / `matrix.features` stay meaningful.
      fail-fast: false
      matrix:
        include:
          - edition: defense
            features: "--features production"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ── DB-isolation / checkpoint-site gates: run in cut-gate.yml ───────
      # These four steps used to run HERE as well:
      #
      #   tools/cut_gate_db_isolation.sh      (5x ENFORCE_*)
      #   tools/cut_gate_negative_probes.sh
      #   tools/cut_gate_checkpoint_sites.sh  (ENFORCE_CHECKPOINT_SITES)
      #   tools/cut_gate_checkpoint_probes.sh
      #
      # They were REMOVED here on 2026-08-30 (ADR-0116 / v0.6.4 landing).
      # Nothing is de-gated: `.github/workflows/cut-gate.yml` invokes the very
      # same four scripts with byte-identical ENFORCE_* env, on the identical
      # trigger set (push:main + pull_request:main), and its job
      # `ADR-0093 DB-isolation cut-gate` is a branch-protection REQUIRED
      # status check. A regression in any of them still blocks the merge; it
      # is simply no longer paid for twice per PR.
      #
      # WHY THIS HAD TO CHANGE — the harness was being billed to two jobs.
      # `cut_gate_negative_probes.sh` re-copies the tree and re-runs the whole
      # gate once per probe, so its cost tracks the gate's size. MEASURED on
      # this repo, same commit, same runner class:
      #
      #   main @5020773   this step 50 m 07 s  ->  ci job 71 m 27 s / 90 cap
      #   ADR-0116 @ff0da0f  this step 69 m 18 s  ->  ci job CANCELLED at 90
      #
      # ADR-0116 changed NO workflow file. It grew the two gate SCRIPTS
      # (cut_gate_db_isolation.sh +178, cut_gate_negative_probes.sh +92), and
      # because both workflows ran them, the +19 min landed twice. ci.yml —
      # which must also fit a ~20-min build/test/clippy/deny tail — blew its
      # cap and `Test` was axed mid-run: a CANCELLED required check, i.e. a
      # false red indistinguishable from a real regression.
      #
      # Raising this job's cap to 120 was the alternative. It was rejected as
      # a band-aid: it keeps paying ~70 min of duplicate work every PR and
      # re-arms the same cliff for the next probe-adding ADR. Deleting this
      # WHOLE job (the other option considered) was rejected outright — see
      # the note below.
      #
      # DO NOT "simplify" by deleting this job because cut-gate.yml exists.
      # cut-gate.yml is deliberately TOOLCHAIN-FREE: it runs no cargo at all.
      # This job is the ONLY place fmt, build, the workspace test suite, the
      # named integration tests, clippy -D warnings and cargo-deny run. Its
      # name is the second required context, `defense · build + lint + test`.
      #
      # What is LOST: the fail-fast ordering, i.e. this job no longer aborts
      # in ~51 s before the build when an isolation gate is red — it now burns
      # its full ~20 min. That is runner time, not coverage: cut-gate.yml runs
      # CONCURRENTLY and still surfaces that same red in ~51 s.
      #
      # The SVG lint below stays: it is NOT duplicated in cut-gate.yml.

      # ── Asset hygiene: strict-parse every tracked SVG (toolchain-free) ──
      # PROD_Defense_v0.2.10 shipped two SVGs with a literal "--" inside an XML
      # comment (XML 1.0 §2.5 forbids it) — latent because browsers are lenient,
      # but strict parsers (expat, rsvg-convert, resvg) refuse. This lint globs
      # `git ls-files '*.svg'` so ANY new SVG anywhere is covered, and its
      # negative probe proves the lint still goes red. Runs before the ~8-min
      # build so a malformed asset fails in seconds. Uses the runner's system
      # python3 (present before setup-python).
      - name: SVG well-formedness lint (all tracked *.svg)
        run: bash tools/lint_svg_wellformed.sh

      - name: SVG lint negative probe (prove the lint has teeth)
        run: bash tools/lint_svg_negative_probe.sh

      - name: Install Tauri system dependencies (Linux)
        # apps/aberp-ui pulls in the Tauri 2 runtime (`wry`, `tao`,
        # `webkit2gtk-sys`, …). On Ubuntu those invoke pkg-config against
        # webkit2gtk-4.1, gtk-3, libsoup-3.0, librsvg, ayatana appindicator;
        # without the -dev packages the `wry`/`tao` build-scripts fail at link.
        # Mirrors the canonical Tauri 2 Ubuntu prerequisites.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libgtk-3-dev

      - name: Install Rust stable (matches rust-toolchain.toml channel pin)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        # apps/aberp-ui embeds the Svelte SPA via Tauri's `generate_context!`,
        # which reads `frontendDist=ui/dist` at compile time. Without a
        # pre-built SPA the macro panics and the whole workspace build fails,
        # so Node + npm ci + vite build must run BEFORE cargo.
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/aberp-ui/ui/package-lock.json

      - name: Build SPA bundle (populates apps/aberp-ui/ui/dist)
        working-directory: apps/aberp-ui/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Python (matches python/aberp-cad-extract pyproject min)
        # crates/aberp-cad-extract-wrapper/tests/* shell out to the Python CLI
        # at python/aberp-cad-extract. Without `python -m aberp_cad_extract`
        # importable, step_extract_smoke / error_paths / schema_version /
        # schema_version_range fail loud with "No module named
        # aberp_cad_extract". (`extract_smoke` was the STL twin of
        # step_extract_smoke and is gone with the STL path — ADR-0112 A.3.)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/aberp-cad-extract/pyproject.toml

      - name: Install aberp-cad-extract Python package (with [step,dev] extras)
        # The [step] extra pulls cadquery-ocp (+ proxy) + vtk. Since ADR-0112
        # Part A made the pipeline STEP-only it is required by EVERY
        # end-to-end extractor test, not just step_extract_smoke.rs — there
        # is no OCCT-free lane left. ABERP_TEST_PYTHON
        # must be ABSOLUTE (pwd-drift in the test harness kills error-path
        # tests); sys.executable is always absolute.
        #
        # [dev] was ADDED 2026-09-02 and is what carries `pytest` (pyproject
        # `[project.optional-dependencies].dev`). Without it the Python suite
        # step below cannot run at all — `[step]` alone installs the OCCT
        # runtime, never a test runner.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'python/aberp-cad-extract[step,dev]'
          echo "ABERP_TEST_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      # ── The Python extractor suite — previously run by NOTHING ───────────
      # Until 2026-09-02 no workflow in this repo executed the Python tests.
      # CI installed the package (step above) purely so the Rust wrapper
      # tests could shell out to the CLI, and then never ran the suite that
      # covers the extractor itself. That made the coverage story dishonest:
      #
      #   • aberp_cad_extract/tests/test_holes.py is 121 of the 167 collected
      #     tests and is the ONLY real coverage of the ADR-0112 Part B
      #     located-hole geometry (diameter, axis, depth, end condition,
      #     through-vs-blind). The Rust-side step_extract_smoke.rs runs a
      #     FLAT PLATE fixture, which mines zero holes — it exercises none
      #     of that geometry and cannot substitute for this.
      #   • The remaining 46 cover the CLI surface, the FeatureGraph schema
      #     (incl. SCHEMA_VERSION drift), and the heuristics.
      #
      # Runs AFTER the install step (needs the [step] OCCT runtime — the
      # hole tests `pytest.importorskip("OCP")` and would silently SKIP,
      # not fail, without it) and BEFORE the Rust build, so a broken
      # extractor is reported in ~30 s rather than after the ~20-min
      # toolchain tail. Measured 167 passed in 31 s.
      #
      # `working-directory` matters: pyproject's [tool.pytest.ini_options]
      # testpaths is the RELATIVE "aberp_cad_extract/tests", so pytest only
      # discovers the suite when invoked from the package root.
      - name: Python extractor test suite (pytest)
        working-directory: python/aberp-cad-extract
        # The `import OCP` line is a GUARD, not a smoke test, and it is the
        # reason this step is trustworthy. test_holes.py opens with
        # `pytest.importorskip("OCP")`, so if the [step] extra ever fails to
        # deliver a working OCCT runtime, 121 of the 167 tests SKIP and
        # pytest still exits 0 — a green step covering nothing. Asserting the
        # import first converts that silent hole into a loud failure.
        # (run/provision_pipeline_venv.sh verifies the same import for the
        # same reason.)
        run: |
          python -c "import OCP"
          python -m pytest

      - name: Cargo cache (per edition arm)
        uses: Swatinem/rust-cache@v2
        with:
          # Portable (default) and Defense (--features production) produce
          # DIFFERENT artifacts; one shared key would thrash and let the ~8-min
          # bundled-DuckDB unit recompile every run. Per-arm key + Cargo.lock
          # hash (added by the action) keeps each arm's cache warm.
          shared-key: aberp-ci-${{ matrix.edition }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build (${{ matrix.edition }}, --locked)
        # --all-targets builds tests/benches/examples too, catching compile
        # errors that would otherwise only surface later in test/clippy.
        run: cargo build --workspace --locked --all-targets ${{ matrix.features }}

      # ── ADR-0098 Gap 1a/1b — the load-bearing DuckDB Handle e2e ──────
      # Run the shared-Handle acceptance proof + the C2 assertion-#1
      # (read-only open coexisting with the live read-write Handle) e2e
      # EXPLICITLY, right after Build and BEFORE the broad workspace Test, so
      # the load-bearing durability verdict is visible at the CI surface and
      # is captured even if a later test step fails. No `production` feature:
      # aberp-db is edition-agnostic (same rationale as the aberp-snapshot
      # crate tests below).
      - name: ADR-0098 DuckDB Handle e2e (assertion #1 + concurrency)
        run: cargo test -p aberp-db --test handle_concurrency_e2e --locked -- --nocapture

      # ADR-0105 — same rationale as the step above: this is the acceptance proof
      # that the two audit-append lock domains (the Handle writer mutex and the
      # audit-ledger AUDIT_APPEND_LOCK) can no longer interleave and fork the
      # hash chain. Surfaced explicitly, before the broad workspace Test, so the
      # verdict is visible even if a later step fails. Single-threaded: the
      # mutual-exclusion guard measures lock WAIT, and cargo's default parallel
      # test threads add scheduler noise to that measurement.
      - name: ADR-0105 audit lock-domain e2e (cross-domain fork)
        run: cargo test -p aberp-db --test audit_lock_domain_e2e --locked -- --nocapture --test-threads=1

      # ADR-0110 D3 — same rationale as the two steps above. This is the
      # acceptance proof that `Handle::durable_ack` actually REACHES the
      # filesystem (main file + WAL) rather than returning Ok and journalling
      # syncs that never happened. It is the counterpart to the census cut-gate
      # in cut-gate.yml: the gate keeps the ack CALLED, this keeps the ack REAL.
      # Surfaced before the broad workspace Test so the verdict is visible even
      # if a later step fails.
      - name: ADR-0110 D3 durable-ack fault injection (fsync reach)
        run: cargo test -p aberp-db --test durable_ack_fault_injection --locked -- --nocapture

      - name: Test (${{ matrix.edition }}, --locked)
        run: cargo test --workspace --locked ${{ matrix.features }}

      - name: Edition-isolation + crash-safe integration tests (by name)
        # Named explicitly (per SAW-OFF.md chunk-3 handoff) so they are visible
        # in the CI log and exercised even if the --workspace set is ever
        # narrowed. These are the bundled-DuckDB / wiring tests the sandbox
        # could not run. The `production` feature exists only on the
        # aberp / aberp-ui packages, so the edition-agnostic crate tests
        # (aberp-snapshot, aberp-audit-ledger) run WITHOUT it.
        run: |
          cargo test -p aberp --test edition_db_isolation ${{ matrix.features }} --locked
          cargo test -p aberp --test edition_snapshot_isolation ${{ matrix.features }} --locked
          cargo test -p aberp-snapshot --test crash_safe_checkpoint_tests --locked
          cargo test -p aberp-snapshot --test edition_isolation_tests --locked
          cargo test -p aberp-audit-ledger ensure_consistent_refuses_and_preserves_when_mirror_ahead_of_db --locked

      - name: Clippy (${{ matrix.edition }}, warnings denied per ADR-0007)
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.features }} -- -D warnings

      # ── Supply chain (arm-independent: operates on Cargo.lock) ──────────
      # These steps were gated `if: matrix.edition == 'portable'` to run the
      # scan once across the two-arm matrix. With the Portable arm dropped
      # (2026-08-04) that condition would be permanently false and the
      # advisory / license scan would silently stop gating every merge — which
      # is exactly what had already been happening, because the Portable arm
      # timed out before ever reaching these steps and reported `skipped`
      # (green). NO `if:` GUARD BELOW. This must run on every PR, always. If
      # you ever add a matrix arm back, do NOT re-gate these to one arm;
      # duplicate work is cheaper than a gate that silently stops gating.
      #
      # cargo-audit was REMOVED here on 2026-08-04. It reads Cargo.lock
      # textually and is feature-BLIND: Cargo.lock records OPTIONAL
      # dependencies whether or not any feature activates them, so cargo-audit
      # reported RUSTSEC-2026-0235 against `rkyv 0.7.46` — a crate this
      # workspace never compiles (an optional `rust_decimal` dep behind a
      # feature nothing enables; `cargo tree -i rkyv` prints "nothing to
      # print"). The only ways to make that green were to ignore a CVE-class
      # advisory or to fork rkyv. cargo-deny resolves features, never saw the
      # crate, and needs no ignore entry — so it is now the single gate.
      # Rationale in full at the top of deny.toml. `[bans]` there fails the
      # build if rkyv ever actually enters the graph, so the elimination is
      # enforced rather than assumed.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo-deny check (advisories, licenses, bans, sources)
        # Severity note: under deny.toml's `[advisories] version = 2` every
        # advisory is ALREADY a hard error — cargo-deny removed the
        # vulnerability/notice/severity-threshold knobs. Strictness comes from
        # deny.toml's `unmaintained = "all"` / `unsound = "all"` SCOPES (the
        # defaults exclude transitive deps, which is how RUSTSEC-2024-0429 went
        # unreported) plus the drift lints promoted to errors below.
        #
        # The four --deny lints are the drift-proofing: each is a WARNING by
        # default, so a config entry that has stopped matching anything would
        # rot silently. A blanket `-D warnings` is deliberately NOT used — it
        # would fail on the 53 benign duplicate-version warnings from the Tauri
        # and windows-sys trees. Unknown lint names are rejected by cargo-deny
        # (exit 2), so a typo here fails loudly rather than weakening the gate.
        #
        #   advisory-not-detected            → an ignore id matching nothing
        #   license-not-encountered          → an allowed license nothing uses
        #   license-exception-not-encountered→ a per-crate exception nothing uses
        #   unmatched-skip                   → a [bans] skip matching nothing
        run: |
          cargo deny check \
            --deny advisory-not-detected \
            --deny license-not-encountered \
            --deny license-exception-not-encountered \
            --deny unmatched-skip
